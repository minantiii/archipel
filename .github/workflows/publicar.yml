name: Publicar release

# Só por tag: publicar é ato deliberado. `git tag v0.1.0 && git push --tags`
# gera o instalador e cria a release; um push comum não publica nada.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # criar a release e anexar arquivos
  id-token: write # assinar o atestado de proveniência
  attestations: write

jobs:
  publicar:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A tag é o que vira o nome do arquivo e o número que o usuário vê. Se ela
      # divergir do package.json, sai um "Archipel Setup 0.1.0.exe" dentro de uma
      # release chamada v0.2.0 — confuso de um jeito que só se descobre tarde.
      - name: Conferir se a tag bate com a versão
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "A tag é v$tag mas o package.json diz $pkg. Alinhe os dois antes de publicar."
            exit 1
          fi
          echo "versão $pkg confirmada"

      # Aqui o binário do Electron é necessário de verdade: ele é empacotado
      # dentro do instalador. Diferente do workflow de verificação, que o pula.
      - run: npm ci

      - name: Conferir tipos e testes antes de publicar
        run: npm run typecheck && npm test

      # O script carrega `--publish never` de propósito. Vendo CI e uma tag, o
      # electron-builder decide publicar a release por conta própria e para com
      # "GitHub Personal Access Token is not set" — depois de já ter compilado o
      # instalador inteiro. Quem cria a release aqui é o passo lá embaixo, que
      # anexa também o SHA256 e as notas geradas.
      - run: npm run build:win

      - name: Calcular o SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          "instalador: $($exe.Name)"
          "sha256:     $hash"

      # Prova criptográfica de que este arquivo saiu deste commit, compilado pelo
      # GitHub e não pela máquina de alguém. É o mais perto de "confiável" que se
      # chega sem pagar por certificado.
      #
      # `continue-on-error` porque atestado exige repositório público: enquanto o
      # repositório for privado o passo falha, e uma release não pode deixar de
      # sair por causa disso.
      - name: Atestar a proveniência
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/*.exe

      # `latest.yml` é o manifesto que o app instalado consulta para saber que
      # existe versão nova; o `.blockmap` é o que permite baixar só a diferença
      # em vez dos 95 MB inteiros. Sem os dois anexados, a atualização automática
      # simplesmente nunca acontece — e sem erro visível para o usuário.
      - name: Criar a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Archipel $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.exe dist/*.blockmap dist/latest.yml dist/SHA256SUMS.txt
