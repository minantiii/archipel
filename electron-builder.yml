appId: com.archipel.app
productName: Archipel
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# De onde o app procura atualização. O repositório é público, então o updater
# baixa sem token nenhum embutido no instalador.
publish:
  provider: github
  owner: minantiii
  repo: archipel

# Sem espaço e sem versão no nome, e nenhum dos dois é preferência estética.
#
# Sem espaço: o `latest.yml` — o manifesto que o updater lê — grava a URL do
# instalador com hífens no lugar dos espaços, enquanto o GitHub, ao receber o
# anexo, troca espaço por ponto. Com "Archipel Setup 0.1.0.exe" os dois nomes
# divergiriam e a atualização quebraria com um 404 que ninguém vê: o app
# simplesmente nunca atualizaria.
#
# Sem versão: é o que faz `releases/latest/download/Archipel-Setup.exe` existir —
# a URL que o GitHub resolve para a última release, e que o botão do site usa
# para baixar direto, sem passar pela página. Ela precisa do nome exato do
# arquivo, então um nome com a versão dentro pararia de existir a cada
# publicação, levando o botão junto. A versão continua visível na release, nas
# propriedades do `.exe` e dentro do app.
artifactName: ${productName}-Setup.${ext}

win:
  # O electron-builder acharia `build/icon.ico` sozinho, mas explícito é melhor:
  # se alguém renomear o arquivo, a build falha dizendo o que faltou em vez de
  # gerar um instalador com o ícone padrão do Electron sem avisar.
  icon: build/icon.ico
  # O app não é assinado. Com a verificação ligada (o padrão), o updater recusa a
  # versão nova por não conseguir confirmar a assinatura, e a atualização morre
  # calada. Quando houver certificado, esta linha é a primeira a sair.
  verifyUpdateCodeSignature: false
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Archipel
  # O idioma do app é escolhido aqui, na primeira tela do assistente, e não por
  # um botão na interface: é decisão de uma vez só, e o topo do app estava
  # gastando um lugar de destaque com ela.
  #
  # A ordem importa: a primeira é a que aparece marcada quando o Windows não
  # está em nenhuma das duas.
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages:
    - pt_BR
    - en_US
  # Leva a escolha do assistente para onde o app lê na abertura. Sem isto, o
  # idioma escolhido aqui morre junto com o instalador.
  include: build/instalador.nsh
  # Sem estes, o assistente sai com o ícone e as artes padrão do NSIS, com cara
  # de instalador de 2005. São gerados por `gerar-imagens-instalador.ps1`.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/instalador-cabecalho.bmp
  installerSidebar: build/instalador-lateral.bmp
  uninstallerSidebar: build/instalador-lateral.bmp
